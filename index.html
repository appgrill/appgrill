<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#15130E" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Control de Feria" />
<title>Control de Feria</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    /* --- paleta refinada: mercado / feria, cálida y profesional --- */
    --bg:#15130E; --bg-elevated:#1A1710;
    --card:#1E1A12; --cardHover:#262015; --border:#352C1E; --borderSoft:#2A2317;
    --text:#F3EEE1; --dim:#AB9C82; --faint:#6E6250;
    --gold:#C9963F; --goldSoft:#E3C583; --goldDim:#8A6B34;
    --green:#7FA872; --greenSoft:#7FA87222;
    --red:#BD6B57; --redSoft:#BD6B5722;
    --blue:#6E93A0; --blueSoft:#6E93A022;
    --radius-sm:8px; --radius-md:12px; --radius-lg:18px;
    --shadow-card: 0 1px 2px rgba(0,0,0,.24), 0 8px 20px -12px rgba(0,0,0,.5);
    --shadow-pop: 0 12px 32px -8px rgba(0,0,0,.55);
    --tap:48px;
  }
  *{box-sizing:border-box; font-family:'Inter',system-ui,sans-serif;}
  html{-webkit-tap-highlight-color:transparent;}
  body{margin:0; background:
      radial-gradient(1200px 600px at 15% -10%, #241D11 0%, transparent 60%),
      var(--bg);
    color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{margin:0; font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em;}
  .wrap{max-width:1080px; margin:0 auto; padding:20px 16px 80px;}
  .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .between{justify-content:space-between;}
  .header-title{font-size:17px; font-weight:600;}
  .status{font-size:11.5px; color:var(--dim); display:flex; align-items:center; gap:5px;}
  .status.saving{color:var(--gold);}
  .icon-badge{background:linear-gradient(160deg,#3A2E17,#211A0E); border:1px solid var(--border); border-radius:12px; padding:9px 11px; display:flex; font-size:18px; box-shadow:var(--shadow-card);}
  .tabs{display:flex; border:1px solid var(--border); border-radius:11px; overflow:hidden; background:var(--card);}
  .tabs button{background:transparent; border:none; color:var(--dim); font-size:13px; padding:11px 16px; cursor:pointer; font-family:inherit; min-height:var(--tap); transition:background .15s,color .15s;}
  .tabs button.active{background:var(--gold); color:#221807; font-weight:600;}
  select, input, button, textarea{font-family:inherit;}
  select, input{background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); padding:11px 12px; font-size:14.5px; outline:none; min-height:var(--tap); transition:border-color .15s;}
  select:focus-visible, input:focus-visible, button:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  input[type="date"]{cursor:pointer;}
  .btn{border-radius:var(--radius-sm); padding:12px 18px; font-size:13.5px; font-weight:600; cursor:pointer; border:1px solid transparent; display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:var(--tap); transition:filter .15s, background .15s, transform .05s;}
  .btn:active{transform:scale(.98);}
  .btn-solid{background:linear-gradient(180deg,var(--goldSoft),var(--gold)); color:#221807; border:none; box-shadow:0 4px 14px -4px rgba(201,150,63,.5);}
  .btn-solid:hover{filter:brightness(1.05);}
  .btn-ghost{background:var(--card); color:var(--dim); border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text); border-color:var(--goldDim);}
  .btn-danger{background:transparent; color:var(--red); border:none; cursor:pointer; min-height:40px; min-width:40px; border-radius:var(--radius-sm);}
  .btn-danger:hover{background:var(--redSoft);}
  .btn-edit{background:transparent; color:var(--gold); border:none; cursor:pointer; min-height:40px; min-width:40px; border-radius:var(--radius-sm); font-size:15px;}
  .btn-edit:hover{background:rgba(201,150,63,.15);}
  .btn-block{width:100%;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px; box-shadow:var(--shadow-card);}
  .kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:20px 0;}
  @media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr);}}
  .kpi-label{font-size:12px; color:var(--dim); display:flex; align-items:center; gap:7px; margin-bottom:8px;}
  .kpi-value{font-size:24px; font-weight:600; font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em;}
  .kpi-sub{font-size:11.5px; color:var(--dim); margin-top:5px;}
  .grid3{display:grid; grid-template-columns:1fr; gap:14px; margin-bottom:20px;}
  @media(min-width:860px){.grid3{grid-template-columns:1.1fr 1fr 1fr;}}
  .field{display:flex; flex-direction:column; gap:5px; font-size:13.5px;}
  .field span{color:var(--dim); font-size:12px;}
  .form-grid{display:grid; grid-template-columns:1fr; gap:12px; margin:16px 0;}
  @media(min-width:640px){.form-grid{grid-template-columns:1fr 1fr;}}
  .pill{border-radius:999px; padding:10px 15px; font-size:12.5px; border:1px solid var(--border); background:var(--bg-elevated); color:var(--dim); cursor:pointer; min-height:40px; transition:background .15s,color .15s,border-color .15s;}
  .pill.active{background:var(--gold); color:#221807; border-color:var(--gold); font-weight:600;}
  .mov-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius-md); background:var(--cardHover); border:1px solid var(--borderSoft); margin-bottom:8px;}
  .mov-icon{border-radius:12px; padding:9px; display:flex; font-size:16px;}
  .mov-title{font-size:13.5px; font-weight:500;}
  .mov-sub{font-size:11.5px; color:var(--dim); margin-top:1px;}
  .mov-value{font-size:14px; font-weight:600; font-family:'Space Grotesk',sans-serif; white-space:nowrap;}
  .mov-actions{display:flex; align-items:center; gap:2px;}
  .mov-photo-btn{border:1px solid var(--border); background:var(--bg-elevated); border-radius:10px; width:40px; height:40px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; padding:0; overflow:hidden;}
  .mov-photo-btn img{width:100%; height:100%; object-fit:cover;}
  .empty{border:1px dashed var(--border); border-radius:var(--radius-md); padding:34px 20px; text-align:center; color:var(--faint); font-size:13.5px;}
  .divider{height:1px; background:var(--border); margin:10px 0;}
  .chart-wrap{position:relative; height:190px;}
  .chart-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none;}
  .modal-title-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .close-btn{background:var(--bg-elevated); border:1px solid var(--border); color:var(--dim); cursor:pointer; font-size:15px; border-radius:9px; width:36px; height:36px;}
  .feria-list-row{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-radius:var(--radius-md); background:var(--cardHover); border:1px solid var(--borderSoft); margin-bottom:8px;}
  .toolbar-btns{display:flex; gap:8px;}
  a.link-btn{color:var(--dim); text-decoration:none;}

  /* --- captura de fotos --- */
  .photo-capture{display:flex; flex-direction:column; gap:10px;}
  .photo-btn-row{display:flex; align-items:center; gap:10px;}
  .photo-thumb-preview{width:64px; height:64px; border-radius:10px; object-fit:cover; border:1px solid var(--border);}
  .photo-input-label{display:inline-flex; align-items:center; gap:7px; cursor:pointer;}
  .photo-hint{font-size:11px; color:var(--faint);}

  /* --- lightbox de foto --- */
  .overlay{position:fixed; inset:0; background:rgba(10,9,6,.72); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .lightbox{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; max-width:520px; width:100%; box-shadow:var(--shadow-pop);}
  .lightbox img{width:100%; max-height:60vh; object-fit:contain; border-radius:var(--radius-md); background:#000; margin:10px 0;}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:99px;}
</style>
</head>

<div class="wrap" id="app"></div>

<script>
/* =========================================================
   PWA: ícono + manifest para "Agregar a inicio" en tablet
========================================================= */
(function setupPWA(){
  try{
    const svgIcon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#15130E"/><rect x="6" y="6" width="180" height="180" rx="36" fill="none" stroke="#C9963F" stroke-width="4"/><text x="96" y="128" font-size="100" text-anchor="middle" font-family="sans-serif">🏪</text></svg>';
    const iconUrl = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svgIcon)));
    const manifest = {
      name: "Control de Feria", short_name: "Feria", start_url: ".", display: "standalone",
      background_color: "#15130E", theme_color: "#15130E",
      icons: [{ src: iconUrl, sizes: "192x192", type: "image/svg+xml" }]
    };
    const manifestUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/json" }));
    const link = document.createElement("link");
    link.rel = "manifest"; link.href = manifestUrl;
    document.head.appendChild(link);
    const appleIcon = document.createElement("link");
    appleIcon.rel = "apple-touch-icon"; appleIcon.href = iconUrl;
    document.head.appendChild(appleIcon);
  }catch(e){ /* si el navegador no soporta algo de esto, la app sigue funcionando igual */ }
})();

/* =========================================================
   GOOGLE DRIVE — configuración
   Reemplaza este valor por el Client ID que crees en Google Cloud
   Console (ver instrucciones aparte). Sin esto, el botón de conectar
   no funciona, pero el resto de la app sigue funcionando normal.
========================================================= */
const GOOGLE_CLIENT_ID = "593736977822-8vlir31qiuf6avtvnrmbbd41ad9n6ca6.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const DRIVE_FOLDER_KEY = "control_feria_drive_folders_v1";

const drive = {
  tokenClient: null,
  accessToken: null,
  tokenExpiresAt: 0,
  connected: false,
  folders: null,   // { root, respaldos, mercado, gasolina, backupFileId }
  status: "",       // texto corto para mostrar en pantalla
  backupTimer: null,
};

function loadDriveFolders(){
  try{ return JSON.parse(localStorage.getItem(DRIVE_FOLDER_KEY)) || null; }catch(e){ return null; }
}
function saveDriveFolders(f){
  try{ localStorage.setItem(DRIVE_FOLDER_KEY, JSON.stringify(f)); }catch(e){}
}
drive.folders = loadDriveFolders();
drive.connected = !!drive.folders; // si ya se configuró antes, se intenta reconectar solo

function setDriveStatus(text){
  drive.status = text;
  const el = document.getElementById("driveStatus");
  if(el) el.textContent = text;
}

function initGoogleClient(){
  if(!window.google || !google.accounts || !google.accounts.oauth2) return; // script de Google aún no cargó
  if(drive.tokenClient) return;
  drive.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: async (resp)=>{
      if(resp.error){ setDriveStatus("No se pudo conectar con Google"); return; }
      drive.accessToken = resp.access_token;
      drive.tokenExpiresAt = Date.now() + (Number(resp.expires_in)||3300)*1000;
      drive.connected = true;
      setDriveStatus("Conectando…");
      try{
        await ensureDriveFolders();
        setDriveStatus("Google Drive conectado ✓");
        render();
      }catch(e){ setDriveStatus("Conectado, pero falló al crear carpetas"); }
    },
  });
  // Si ya se conectó antes en esta tablet, intenta renovar el permiso sin mostrar ventanas
  if(drive.connected){
    try{ drive.tokenClient.requestAccessToken({ prompt: "" }); }catch(e){}
  }
}

function connectDrive(){
  if(!drive.tokenClient){ setDriveStatus("Google todavía está cargando, espera un segundo e inténtalo de nuevo"); return; }
  drive.tokenClient.requestAccessToken({ prompt: "consent" });
}

async function ensureToken(){
  if(drive.accessToken && Date.now() < drive.tokenExpiresAt - 60000) return drive.accessToken;
  return new Promise((resolve, reject)=>{
    if(!drive.tokenClient){ reject(new Error("Google no está listo")); return; }
    const prevCallback = drive.tokenClient.callback;
    drive.tokenClient.callback = (resp)=>{
      drive.tokenClient.callback = prevCallback;
      if(resp.error){ reject(new Error(resp.error)); return; }
      drive.accessToken = resp.access_token;
      drive.tokenExpiresAt = Date.now() + (Number(resp.expires_in)||3300)*1000;
      resolve(drive.accessToken);
    };
    drive.tokenClient.requestAccessToken({ prompt: "" });
  });
}

async function driveFindOrCreateFolder(name, parentId){
  const token = await ensureToken();
  const q = encodeURIComponent(`name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false` + (parentId ? ` and '${parentId}' in parents` : ""));
  const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
    headers: { Authorization: "Bearer " + token },
  });
  const listData = await listRes.json();
  if(listData.files && listData.files.length) return listData.files[0].id;
  const metadata = { name, mimeType: "application/vnd.google-apps.folder" };
  if(parentId) metadata.parents = [parentId];
  const createRes = await fetch("https://www.googleapis.com/drive/v3/files", {
    method: "POST",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify(metadata),
  });
  const created = await createRes.json();
  return created.id;
}

async function ensureDriveFolders(){
  if(drive.folders && drive.folders.root && drive.folders.mercado && drive.folders.gasolina && drive.folders.respaldos) return drive.folders;
  const root = await driveFindOrCreateFolder("Will's Grill - Control de Feria", null);
  const respaldos = await driveFindOrCreateFolder("Respaldos", root);
  const mercado = await driveFindOrCreateFolder("Facturas Mercado", root);
  const gasolina = await driveFindOrCreateFolder("Facturas Gasolina", root);
  drive.folders = { root, respaldos, mercado, gasolina, backupFileId: drive.folders?.backupFileId || null };
  saveDriveFolders(drive.folders);
  return drive.folders;
}

/* Sube (o actualiza) el respaldo completo de datos como un .json en la carpeta "Respaldos" */
async function driveUploadBackup(){
  if(!drive.connected) return;
  try{
    await ensureDriveFolders();
    const token = await ensureToken();
    const data = { ferias: state.ferias, movimientos: state.movimientos, exportadoEl: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    if(drive.folders.backupFileId){
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${drive.folders.backupFileId}?uploadType=media`, {
        method: "PATCH",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: blob,
      });
    }else{
      const boundary = "cferia" + uid();
      const metadata = { name: "respaldo-control-feria.json", parents: [drive.folders.respaldos] };
      const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(data)}\r\n--${boundary}--`;
      const createRes = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": `multipart/related; boundary=${boundary}` },
        body,
      });
      const created = await createRes.json();
      drive.folders.backupFileId = created.id;
      saveDriveFolders(drive.folders);
    }
    setDriveStatus("Respaldo en Drive actualizado ✓");
  }catch(e){ setDriveStatus("No se pudo respaldar en Drive (revisa conexión)"); }
}

/* Llama esto cada vez que cambian los datos: espera unos segundos de calma antes de subir,
   para no disparar una subida por cada tecla o cambio. */
function scheduleDriveBackup(){
  if(!drive.connected) return;
  clearTimeout(drive.backupTimer);
  drive.backupTimer = setTimeout(driveUploadBackup, 2500);
}

/* Sube una foto de factura a la carpeta que corresponde según el tipo de movimiento */
async function driveUploadFactura(mov, feria){
  if(!drive.connected || !mov.fotoFactura) return;
  const folderId = mov.tipo === "Factura Mercado" ? drive.folders?.mercado
                  : mov.tipo === "Gasolina" ? drive.folders?.gasolina : null;
  if(!folderId) return;
  try{
    await ensureDriveFolders();
    const token = await ensureToken();
    const blob = dataURLtoBlob(mov.fotoFactura);
    const filename = `${mov.tipo}_${mov.fecha}_${(feria?.nombre||"feria").replace(/[^a-z0-9]+/gi,"-")}.jpg`;
    const boundary = "cferia" + uid();
    const metadata = { name: filename, parents: [folderId] };
    const reader = new FileReader();
    const base64 = await new Promise((resolve,reject)=>{
      reader.onload = ()=> resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
    const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: image/jpeg\r\nContent-Transfer-Encoding: base64\r\n\r\n${base64}\r\n--${boundary}--`;
    const uploadRes = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink", {
      method: "POST",
      headers: { Authorization: "Bearer " + token, "Content-Type": `multipart/related; boundary=${boundary}` },
      body,
    });
    const uploaded = await uploadRes.json();
    if(uploaded && uploaded.webViewLink){
      const target = state.movimientos.find(m=>m.id===mov.id);
      if(target){
        target.fotoDriveLink = uploaded.webViewLink;
        saveData({ ferias: state.ferias, movimientos: state.movimientos });
        render();
      }
    }
    setDriveStatus(`Foto subida a Drive (${mov.tipo}) ✓`);
  }catch(e){ setDriveStatus("No se pudo subir la foto a Drive"); }
}

window.addEventListener("load", ()=>{
  let tries = 0;
  const tryInit = ()=>{
    tries++;
    initGoogleClient();
    if(!drive.tokenClient && tries < 20) setTimeout(tryInit, 500);
  };
  setTimeout(tryInit, 300);
});

/* =========================================================
   DATOS / PERSISTENCIA (localStorage — vive en ESTE navegador,
   en ESTE archivo. Por eso el respaldo manual es tan importante.)
========================================================= */
const STORAGE_KEY = "control_feria_data_v1";
const MEDIOS_PAGO = ["Efectivo", "Tarjeta"];
const TIPOS = ["Venta", "Factura Mercado", "Gasolina", "Otro gasto", "Pago a trabajador", "Consignación"];
const CATEGORIAS = ["Alquiler / stand", "Empaques y desechables", "Hielo", "Gas", "Imprevistos", "Sueldo", "Reembolso"];
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return { ferias: [], movimientos: [] };
    const parsed = JSON.parse(raw);
    return { ferias: parsed.ferias || [], movimientos: parsed.movimientos || [] };
  }catch(e){ return { ferias: [], movimientos: [] }; }
}
function saveData(data){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; }
  catch(e){ return false; }
}

let state = {
  ...loadData(),
  feriaId: null,
  view: "feria",
  showFeriaForm: false,
  showMovForm: false,
  editingMovId: null,   // id del movimiento que se está editando (null = registrando uno nuevo)
  movTipo: "Venta",
  mes: new Date().getMonth(),
  anio: new Date().getFullYear(),
  tempFoto: "",       // foto capturada mientras el formulario de movimiento está abierto
  tempMovDraft: { fecha:"", valor:"", medioPago:"", propina:"", categoria:"", trabajador:"", descripcion:"" },
  tempTrabajadores: [""], // nombres de trabajadores mientras el formulario de feria está abierto
  tempFeriaDraft: { nombre:"", encargado:"", fechaInicio:"", fechaCierre:"", diasArmada:1, diasVenta:3 },
  lightboxPhoto: null,  // dataURL de la foto mostrada en el visor
  lightboxMovId: null,
  saveError: false,
  exportDraft: { scope:"mes", desde:"", hasta:"", feriaId:"" },
};
if(state.ferias.length) state.feriaId = state.ferias[state.ferias.length-1].id;

function persist(){
  const ok = saveData({ ferias: state.ferias, movimientos: state.movimientos });
  state.saveError = !ok;
  flashSaved(ok);
  scheduleDriveBackup();
}
function flashSaved(ok){
  const el = document.getElementById("saveStatus");
  if(!el) return;
  if(!ok){
    el.textContent = "No se pudo guardar (memoria llena) — haz un respaldo";
    el.classList.remove("saving");
    return;
  }
  el.textContent = "Guardado ✓";
  el.classList.add("saving");
  setTimeout(()=>{ if(el){ el.textContent = "Guardado automáticamente"; el.classList.remove("saving"); } }, 1200);
}

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const todayISO = () => new Date().toISOString().slice(0,10);
function addDays(iso, days){
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + Number(days));
  return d.toISOString().slice(0,10);
}
const fmt = (n) => "$" + (Number(n)||0).toLocaleString("es-CO", {maximumFractionDigits:0});

// Devuelve la lista de trabajadores de una feria. Si la feria es antigua y solo
// tiene un número (nTrabajadores) en vez de nombres, genera nombres genéricos.
function getTrabajadores(feria){
  if(feria.trabajadores && feria.trabajadores.length) return feria.trabajadores;
  const n = feria.nTrabajadores || 1;
  return Array.from({length:n}, (_,i)=>({ id:"legacy_"+i, nombre:"Trabajador "+(i+1) }));
}

const ICONS = {
  "Venta": "💵", "Factura Mercado": "🧺", "Gasolina": "⛽", "Otro gasto": "🧾",
  "Pago a trabajador": "👥", "Consignación": "🏦",
};
const TONE = {
  "Venta": "var(--green)", "Factura Mercado": "var(--red)", "Gasolina": "var(--red)",
  "Otro gasto": "var(--red)", "Pago a trabajador": "var(--red)", "Consignación": "var(--blue)",
};
const CATEGORY_COLORS = {
  "Mercado": "#C9963F", "Gasolina": "#BD6B57", "Otros gastos": "#6E93A0", "Pago a trabajadores": "#7FA872",
};

/* =========================================================
   CÁLCULOS
========================================================= */
function computeTotals(movs){
  const sum = (tipo, medio) => movs.filter(m => m.tipo===tipo && (!medio || m.medioPago===medio))
    .reduce((a,m)=>a+(Number(m.valor)||0),0);
  const ventas = sum("Venta");
  const mercado = sum("Factura Mercado");
  const gasolina = sum("Gasolina");
  const otro = sum("Otro gasto");
  const pagos = sum("Pago a trabajador");
  const gastos = mercado+gasolina+otro+pagos;
  const consignado = sum("Consignación");
  const propinas = movs.filter(m=>m.tipo==="Venta").reduce((a,m)=>a+(Number(m.propina)||0),0);
  const efectivoVentas = sum("Venta","Efectivo");
  const tarjetaVentas = sum("Venta","Tarjeta");
  const efectivoGastos = sum("Factura Mercado","Efectivo")+sum("Gasolina","Efectivo")+sum("Otro gasto","Efectivo")+sum("Pago a trabajador","Efectivo");
  return {
    ventas, mercado, gasolina, otro, pagos, gastos, consignado, propinas,
    utilidad: ventas-gastos, efectivoVentas, tarjetaVentas,
    cajaEsperada: efectivoVentas - efectivoGastos - consignado,
  };
}
function categoryBreakdown(t){
  return [
    {name:"Mercado", value:t.mercado},
    {name:"Gasolina", value:t.gasolina},
    {name:"Otros gastos", value:t.otro},
    {name:"Pago a trabajadores", value:t.pagos},
  ].filter(d=>d.value>0);
}

function kpi(icon,label,value,color,sub){
  return `<div class="card">
    <div class="kpi-label">${icon} ${label}</div>
    <div class="kpi-value" style="color:${color};">${value}</div>
    ${sub?`<div class="kpi-sub">${sub}</div>`:""}
  </div>`;
}

    <div style="flex:1; min-width:0;">
      <div class="mov-title">${m.tipo}${m.trabajador?` · ${escapeHtml(m.trabajador)}`:""}${(m.categoria && m.tipo!=="Pago a trabajador")?` · ${escapeHtml(m.categoria)}`:""}</div>

    </div>
    <div class="mov-value" style="color:${isIngreso?"var(--green)":"var(--red)"};">${isIngreso?"+":"-"}${fmt(m.valor)}</div>
    <div class="mov-actions">
      ${m.fotoFactura ? `<button class="mov-photo-btn" data-photo="${m.id}" title="Ver foto"><img src="${m.fotoFactura}" alt="Foto factura"/></button>` : ""}

function renderMensualTab(){
  const ferias = state.ferias.filter(f=>{
    const d = new Date(f.fechaInicio+"T00:00:00");
    return d.getMonth()===state.mes && d.getFullYear()===state.anio;
  });
  const feriaIds = new Set(ferias.map(f=>f.id));
  const movsDelMes = state.movimientos.filter(m=>{
    const d = new Date(m.fecha+"T00:00:00");
    return d.getMonth()===state.mes && d.getFullYear()===state.anio;
  });
  const t = computeTotals(movsDelMes);
  const porFeria = ferias.map(f=>({feria:f, t: computeTotals(state.movimientos.filter(m=>m.feriaId===f.id))}));

  const years = Array.from({length:5}, (_,i)=> new Date().getFullYear()-2+i);

  return `
  <div class="row" style="margin-bottom:16px;">
    📆
    <select id="mesSelect">${MESES.map((m,i)=>`<option value="${i}" ${i===state.mes?"selected":""}>${m}</option>`).join("")}</select>
    <select id="anioSelect">${years.map(y=>`<option value="${y}" ${y===state.anio?"selected":""}>${y}</option>`).join("")}</select>
    <span style="font-size:12px;color:var(--faint);">${porFeria.length} feria(s) este mes</span>
  </div>
  <div class="kpis">
    ${kpi("📈","Ventas del mes", fmt(t.ventas), "var(--green)")}
    ${kpi("📉","Gastos del mes", fmt(t.gastos), "var(--red)")}
    ${kpi("👛","Utilidad del mes", fmt(t.utilidad), t.utilidad>=0?"var(--green)":"var(--red)")}
    ${kpi("🏦","Consignado", fmt(t.consignado), "var(--gold)")}
  </div>
  ${porFeria.length===0 ? `<div class="empty">No hay ferias registradas este mes.</div>` :
    porFeria.map(({feria,t})=>`
    <div class="feria-list-row">
      <div>
        <div style="font-size:13px;">${escapeHtml(feria.nombre)}</div>
        <div style="font-size:11px;color:var(--dim);">${feria.fechaInicio} → ${feria.fechaCierre}</div>
      </div>
      <div class="row" style="gap:16px;">
        <span style="color:var(--green);font-size:13px;">${fmt(t.ventas)}</span>
        <span style="color:var(--red);font-size:13px;">${fmt(t.gastos)}</span>
        <span style="font-weight:600;font-size:13px;color:${t.utilidad>=0?"var(--green)":"var(--red)"};">${fmt(t.utilidad)}</span>
      </div>
    </div>`).join("")
  }
  ${renderExportPanel()}
  `;
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function drawDonut(feria){
  const ctx = document.getElementById("donut");
  if(!ctx) return;
  const movs = state.movimientos.filter(m=>m.feriaId===feria.id);
  const t = computeTotals(movs);
  const data = categoryBreakdown(t);
  if(chartInstance){ chartInstance.destroy(); chartInstance = null; }
  if(!data.length) return;
  chartInstance = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: data.map(d=>d.name),
      datasets: [{ data: data.map(d=>d.value), backgroundColor: data.map(d=>CATEGORY_COLORS[d.name]), borderWidth: 0 }],
    },
    options: {
      cutout: "68%",
      plugins: { legend: { display:false }, tooltip: { callbacks: { label: (c)=> c.label+": "+fmt(c.raw) } } },
      maintainAspectRatio: false,
    },
  });
}

========================================================= */
function compressImage(file, maxSize){
  maxSize = maxSize || 1280;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error("No se pudo leer la imagen"));
    reader.onload = (ev)=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error("No se pudo procesar la imagen"));
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxSize){ height = Math.round(height * (maxSize/width)); width = maxSize; }
        else if(height > maxSize){ width = Math.round(width * (maxSize/height)); height = maxSize; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const c = canvas.getContext("2d");
        c.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function dataURLtoBlob(dataUrl){
  const [meta, b64] = dataUrl.split(",");
  const mime = meta.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

async function sharePhoto(dataUrl){
  const filename = "factura-" + todayISO() + ".jpg";
  try{
    const blob = dataURLtoBlob(dataUrl);
    const file = new File([blob], filename, { type: "image/jpeg" });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:"Foto de factura", text:"Control de Feria" });
      return;
    }
  }catch(e){ /* si el usuario cancela el share, no hacemos nada más */ }
  downloadPhoto(dataUrl);
}
function downloadPhoto(dataUrl){
  const filename = "factura-" + todayISO() + ".jpg";
  const a = document.createElement("a");
  a.href = dataUrl; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* =========================================================
   EXPORTAR A EXCEL (.xlsx) — por mes, rango de fechas, una feria, o todo
========================================================= */
function getMovsParaExportar(){
  const d = state.exportDraft;
  let ferias = state.ferias;
  let movs = state.movimientos;

  if(d.scope === "mes"){
    ferias = state.ferias.filter(f=>{
      const dt = new Date(f.fechaInicio+"T00:00:00");
      return dt.getMonth()===state.mes && dt.getFullYear()===state.anio;
    });
    movs = state.movimientos.filter(m=>{
      const dt = new Date(m.fecha+"T00:00:00");
      return dt.getMonth()===state.mes && dt.getFullYear()===state.anio;
    });
  }else if(d.scope === "rango"){
    const desde = d.desde || "0000-01-01";
    const hasta = d.hasta || "9999-12-31";
    movs = state.movimientos.filter(m=> m.fecha>=desde && m.fecha<=hasta);
    ferias = state.ferias.filter(f=> f.fechaInicio<=hasta && (f.fechaCierre||f.fechaInicio)>=desde);
  }else if(d.scope === "feria"){
    ferias = state.ferias.filter(f=> f.id===d.feriaId);
    movs = state.movimientos.filter(m=> m.feriaId===d.feriaId);
  }
  // "todo" usa todo tal cual

  return { ferias, movs };
}

/* =========================================================
   ESTILOS PARA EL EXCEL EXPORTADO (paleta del app, vía ExcelJS)
========================================================= */
const XLS_MONEY_FMT = '"$"#,##0';
const XLS_GOLD="FFC9963F", XLS_GOLD_SOFT="FFE3C583", XLS_DARK="FF2A2317", XLS_DARK_TEXT="FF221807",
      XLS_DIM_TEXT="FF8A7F68", XLS_ROW_ALT="FFF7F0E3", XLS_ROW_BASE="FFFFFFFF", XLS_BORDER_SOFT="FFE3D9C2";
const XLS_TABCOLORS = {
  RESUMEN: XLS_GOLD, FERIAS: XLS_GOLD, VENTAS: "FF7FA872", MERCADO: "FFBD6B57", GASOLINA: "FFBD6B57",
  "OTROS GASTOS": "FFBD6B57", PROPINAS: XLS_GOLD, PAGOS: "FFBD6B57", CONSIGNACIONES: "FF6E93A0", INVENTARIO: "FF8A6B34",
};

function xlsStyleTitleRow(ws, rowNum, colCount){
  const span = Math.max(colCount,2);
  ws.mergeCells(rowNum,1,rowNum,span);
  const row = ws.getRow(rowNum);
  row.height = 26;
  for(let c=1;c<=span;c++){
    const cell = row.getCell(c);
    cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb:XLS_GOLD} };
    cell.font = { bold:true, size:13, color:{argb:"FFFFFFFF"} };
    cell.alignment = { vertical:"middle" };
  }
}
function xlsStyleSubtitleRow(ws, rowNum, colCount){
  const span = Math.max(colCount,2);
  ws.mergeCells(rowNum,1,rowNum,span);
  ws.getRow(rowNum).getCell(1).font = { italic:true, size:10, color:{argb:XLS_DIM_TEXT} };
}
function xlsStyleFeriaBanner(ws, rowNum, colCount){
  const span = Math.max(colCount,2);
  ws.mergeCells(rowNum,1,rowNum,span);
  const row = ws.getRow(rowNum);
  row.height = 20;
  for(let c=1;c<=span;c++){
    const cell = row.getCell(c);
    cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb:XLS_GOLD_SOFT} };
    cell.font = { bold:true, size:12, color:{argb:XLS_DARK_TEXT} };
  }
}
function xlsStyleSectionRow(ws, rowNum, colCount){
  const span = Math.max(colCount,2);
  ws.mergeCells(rowNum,1,rowNum,span);
  const row = ws.getRow(rowNum);
  row.height = 18;
  for(let c=1;c<=span;c++){
    const cell = row.getCell(c);
    cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb:XLS_DARK} };
    cell.font = { bold:true, size:10.5, color:{argb:XLS_GOLD_SOFT} };
  }
}
function xlsStyleHeaderRow(ws, rowNum, colCount){
  const row = ws.getRow(rowNum);
  row.height = 18;
  for(let c=1;c<=colCount;c++){
    const cell = row.getCell(c);
    cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb:XLS_GOLD_SOFT} };
    cell.font = { bold:true, color:{argb:XLS_DARK_TEXT} };
    cell.border = { top:{style:"thin",color:{argb:XLS_GOLD}}, bottom:{style:"thin",color:{argb:XLS_GOLD}} };
    cell.alignment = { vertical:"middle" };
  }
}
function xlsStyleDataRow(ws, rowNum, colCount, idx){
  const bg = idx%2===0 ? XLS_ROW_BASE : XLS_ROW_ALT;
  const row = ws.getRow(rowNum);
  for(let c=1;c<=colCount;c++){
    const cell = row.getCell(c);
    cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb:bg} };
    cell.border = { bottom:{style:"hair", color:{argb:XLS_BORDER_SOFT}} };
  }
}
function xlsAddKV(ws, label, value, opts={}){
  ws.addRow([label, value]);
  const rowNum = ws.lastRow.number;
  const row = ws.getRow(rowNum);
  row.getCell(1).font = { bold: !!opts.bold, color:{argb: opts.bold?XLS_DARK_TEXT:"FF3A3226"} };
  row.getCell(2).font = { bold:true, color:{argb:XLS_DARK_TEXT} };
  if(typeof value === "number") row.getCell(2).alignment = { horizontal:"right" };
  row.getCell(1).border = { bottom:{style:"hair", color:{argb:XLS_BORDER_SOFT}} };
  row.getCell(2).border = { bottom:{style:"hair", color:{argb:XLS_BORDER_SOFT}} };
  if(opts.money && typeof value === "number") row.getCell(2).numFmt = XLS_MONEY_FMT;
  if(opts.percent && typeof value === "number") row.getCell(2).numFmt = "0.0%";
  return rowNum;
}
function xlsBuildTableSheet(wb, {name, title, subtitle, headers, rows, moneyCols=[], widths, linkColIdx=null, linkTargets=null}){
  const ws = wb.addWorksheet(name);
  ws.properties.tabColor = { argb: XLS_TABCOLORS[name] || XLS_GOLD };
  if(widths) ws.columns = widths.map(w=>({width:w}));
  const colCount = headers.length;

  ws.addRow([title]); xlsStyleTitleRow(ws, 1, colCount);
  ws.addRow([subtitle||""]); xlsStyleSubtitleRow(ws, 2, colCount);
  ws.addRow([]);
  ws.addRow(headers); xlsStyleHeaderRow(ws, 4, colCount);

  rows.forEach((row,i)=>{
    ws.addRow(row);
    const rowNum = 5+i;
    xlsStyleDataRow(ws, rowNum, colCount, i);
    moneyCols.forEach(ci=>{
      const cell = ws.getRow(rowNum).getCell(ci);
      if(typeof cell.value === "number") cell.numFmt = XLS_MONEY_FMT;
    });
    if(linkColIdx && linkTargets && linkTargets[i]){
      const cell = ws.getRow(rowNum).getCell(linkColIdx);
      cell.value = { text: String(cell.value||"Ver foto"), hyperlink: linkTargets[i] };
      cell.font = { color:{argb:"FF3D6B7A"}, underline:true };
    }
  });

  ws.views = [{ state:"frozen", ySplit:4 }];
  if(rows.length) ws.autoFilter = { from:{row:4,column:1}, to:{row:4+rows.length,column:colCount} };
  return ws;
}

/* =========================================================
   EXPORTAR A EXCEL (.xlsx) — por mes, rango de fechas, una feria, o todo
========================================================= */
async function exportarExcel(){
  if(typeof ExcelJS === "undefined"){ alert("El generador de Excel todavía está cargando, espera un segundo e inténtalo de nuevo."); return; }
  const { ferias, movs } = getMovsParaExportar();
  if(!movs.length){ alert("No hay movimientos para exportar con ese filtro."); return; }

  const feriaNombre = (id)=> (state.ferias.find(f=>f.id===id)||{}).nombre || "—";
  const sorted = [...movs].sort((a,b)=> a.fecha < b.fecha ? -1 : 1);
  const tAll = computeTotals(movs);

  const fotoValor = (m)=>{
    if(m.fotoDriveLink) return "Ver foto en Drive";
    if(m.fotoFactura) return "Sí (sin subir a Drive todavía)";
    return "";
  };

  const wb = new ExcelJS.Workbook();
  wb.creator = "Control de Feria";
  wb.created = new Date();

  /* ============ RESUMEN ============ */
  const wsResumen = wb.addWorksheet("RESUMEN");
  wsResumen.properties.tabColor = { argb: XLS_TABCOLORS.RESUMEN };
  wsResumen.columns = [{width:34},{width:20}];
  wsResumen.addRow(["CONTROL DE FERIA — RESUMEN"]); xlsStyleTitleRow(wsResumen,1,2);
  wsResumen.addRow([`Generado el ${new Date().toLocaleDateString("es-CO")}`]); xlsStyleSubtitleRow(wsResumen,2,2);
  wsResumen.addRow([]);

  ferias.forEach(feria=>{
    const movsFeria = movs.filter(m=>m.feriaId===feria.id);
    const t = computeTotals(movsFeria);
    const trabajadoresFeria = getTrabajadores(feria);
    const propinaPersona = t.propinas/(trabajadoresFeria.length||1);
    const efectivoGastos = movsFeria
      .filter(m=>["Factura Mercado","Gasolina","Otro gasto","Pago a trabajador"].includes(m.tipo) && m.medioPago==="Efectivo")
      .reduce((a,m)=>a+(Number(m.valor)||0),0);

    wsResumen.addRow([`FERIA: ${feria.nombre}`]); xlsStyleFeriaBanner(wsResumen, wsResumen.lastRow.number, 2);
    wsResumen.addRow([`Encargado: ${feria.encargado||"—"}  |  Del ${feria.fechaInicio} al ${feria.fechaCierre||"—"}  |  Trabajadores: ${trabajadoresFeria.length}`]);
    xlsStyleSubtitleRow(wsResumen, wsResumen.lastRow.number, 2);
    wsResumen.addRow([]);

    wsResumen.addRow(["RESULTADO GENERAL",""]); xlsStyleSectionRow(wsResumen, wsResumen.lastRow.number, 2);
    xlsAddKV(wsResumen, "Ventas totales", t.ventas, {money:true});
    xlsAddKV(wsResumen, "Total gastos", t.gastos, {money:true});
    xlsAddKV(wsResumen, "UTILIDAD", t.utilidad, {money:true, bold:true});
    xlsAddKV(wsResumen, "Margen", t.ventas ? (t.utilidad/t.ventas) : 0, {percent:true});
    xlsAddKV(wsResumen, "Efectivo esperado en caja", t.cajaEsperada, {money:true});
    xlsAddKV(wsResumen, "Consignado al superior", t.consignado, {money:true});
    xlsAddKV(wsResumen, "Gastos pagados en efectivo", efectivoGastos, {money:true});
    xlsAddKV(wsResumen, "Total propinas recogidas", t.propinas, {money:true});
    xlsAddKV(wsResumen, "Propina por persona", propinaPersona, {money:true});
    wsResumen.addRow([]);

    wsResumen.addRow(["DESGLOSE DE GASTOS",""]); xlsStyleSectionRow(wsResumen, wsResumen.lastRow.number, 2);
    xlsAddKV(wsResumen, "Mercado (facturas)", t.mercado, {money:true});
    xlsAddKV(wsResumen, "Gasolina", t.gasolina, {money:true});
    xlsAddKV(wsResumen, "Otros gastos generales", t.otro, {money:true});
    xlsAddKV(wsResumen, "Sueldos y pagos", t.pagos, {money:true});
    xlsAddKV(wsResumen, "TOTAL GASTOS", t.gastos, {money:true, bold:true});
    wsResumen.addRow([]);

    wsResumen.addRow(["VENTAS POR MEDIO DE PAGO",""]); xlsStyleSectionRow(wsResumen, wsResumen.lastRow.number, 2);
    xlsAddKV(wsResumen, "Efectivo", t.efectivoVentas, {money:true});
    xlsAddKV(wsResumen, "Tarjeta", t.tarjetaVentas, {money:true});
    xlsAddKV(wsResumen, "TOTAL", t.efectivoVentas+t.tarjetaVentas, {money:true, bold:true});
    wsResumen.addRow([]);
    wsResumen.addRow([]);
  });

  const rangoTexto = sorted.length ? `${sorted[0].fecha} → ${sorted[sorted.length-1].fecha}` : "";
  wsResumen.addRow(["RESUMEN DEL PERIODO EXPORTADO",""]); xlsStyleSectionRow(wsResumen, wsResumen.lastRow.number, 2);
  xlsAddKV(wsResumen, "Rango de fechas incluido", rangoTexto, {});
  xlsAddKV(wsResumen, "Ventas", tAll.ventas, {money:true});
  xlsAddKV(wsResumen, "Gastos", tAll.gastos, {money:true});
  xlsAddKV(wsResumen, "Utilidad", tAll.utilidad, {money:true, bold:true});
  xlsAddKV(wsResumen, "Consignado", tAll.consignado, {money:true});
  xlsAddKV(wsResumen, "Propinas", tAll.propinas, {money:true});
  xlsAddKV(wsResumen, "Caja esperada (efectivo)", tAll.cajaEsperada, {money:true});
  xlsAddKV(wsResumen, "N° de ferias incluidas", ferias.length, {});
  wsResumen.views = [{ state:"frozen", ySplit:2 }];

  /* ============ FERIAS ============ */
  xlsBuildTableSheet(wb, {
    name:"FERIAS", title:"FERIAS", subtitle:`${ferias.length} feria(s) incluida(s) en este export`,
    headers:["FERIA","ENCARGADO","FECHA INICIO","DÍAS ARMADA","DÍAS VENTA","FECHA CIERRE","N° TRABAJADORES","TRABAJADORES (nombres)"],
    rows: ferias.map(f=>{
      const trabs = getTrabajadores(f);
      return [f.nombre, f.encargado||"", f.fechaInicio, Number(f.diasArmada)||0, Number(f.diasVenta)||0, f.fechaCierre||"", trabs.length, trabs.map(w=>w.nombre).join(", ")];
    }),
    widths:[20,16,13,11,10,13,15,34],
  });

  /* ============ VENTAS ============ */
  const ventas = sorted.filter(m=>m.tipo==="Venta");
  xlsBuildTableSheet(wb, {
    name:"VENTAS", title:"VENTAS",
    subtitle:`Venta total: ${fmt(tAll.ventas)}   |   Efectivo: ${fmt(tAll.efectivoVentas)}   |   Tarjeta: ${fmt(tAll.tarjetaVentas)}`,
    headers:["FECHA","MEDIO DE PAGO","VALOR","PROPINA","DESCRIPCIÓN","FERIA"],
    rows: ventas.map(m=>[m.fecha, m.medioPago||"", Number(m.valor)||0, Number(m.propina)||0, m.descripcion||"", feriaNombre(m.feriaId)]),
    moneyCols:[3,4], widths:[11,13,11,10,26,18],
  });

  /* ============ MERCADO ============ */
  const mercado = sorted.filter(m=>m.tipo==="Factura Mercado");
  xlsBuildTableSheet(wb, {
    name:"MERCADO", title:"MERCADO", subtitle:`Total mercado: ${fmt(tAll.mercado)}   |   N° de facturas: ${mercado.length}`,
    headers:["FECHA","VALOR","MEDIO DE PAGO","FOTO FACTURA","DESCRIPCIÓN","FERIA"],
    rows: mercado.map(m=>[m.fecha, Number(m.valor)||0, m.medioPago||"", fotoValor(m), m.descripcion||"", feriaNombre(m.feriaId)]),
    moneyCols:[2], widths:[11,11,13,20,26,18],
    linkColIdx:4, linkTargets: mercado.map(m=>m.fotoDriveLink||null),
  });

  /* ============ GASOLINA ============ */
  const gasolina = sorted.filter(m=>m.tipo==="Gasolina");
  xlsBuildTableSheet(wb, {
    name:"GASOLINA", title:"GASOLINA", subtitle:`Total gasolina: ${fmt(tAll.gasolina)}   |   N° de tanqueos: ${gasolina.length}`,
    headers:["FECHA","VALOR","MEDIO DE PAGO","FOTO FACTURA","DESCRIPCIÓN","FERIA"],
    rows: gasolina.map(m=>[m.fecha, Number(m.valor)||0, m.medioPago||"", fotoValor(m), m.descripcion||"", feriaNombre(m.feriaId)]),
    moneyCols:[2], widths:[11,11,13,20,26,18],
    linkColIdx:4, linkTargets: gasolina.map(m=>m.fotoDriveLink||null),
  });

  /* ============ OTROS GASTOS ============ */
  const otros = sorted.filter(m=>m.tipo==="Otro gasto");
  xlsBuildTableSheet(wb, {
    name:"OTROS GASTOS", title:"OTROS GASTOS", subtitle:`Total otros gastos: ${fmt(tAll.otro)}   |   N° de gastos: ${otros.length}`,
    headers:["FECHA","CATEGORÍA","VALOR","MEDIO DE PAGO","DESCRIPCIÓN","FERIA"],
    rows: otros.map(m=>[m.fecha, m.categoria||"", Number(m.valor)||0, m.medioPago||"", m.descripcion||"", feriaNombre(m.feriaId)]),
    moneyCols:[3], widths:[11,20,11,13,26,18],
  });

  /* ============ PROPINAS ============ */
  const propinasMovs = sorted.filter(m=>m.tipo==="Venta" && (Number(m.propina)||0)>0);
  xlsBuildTableSheet(wb, {
    name:"PROPINAS", title:"PROPINAS", subtitle:`Total propinas: ${fmt(tAll.propinas)}`,
    headers:["FECHA","PROPINA","MEDIO DE PAGO","DESCRIPCIÓN","FERIA"],
    rows: propinasMovs.map(m=>[m.fecha, Number(m.propina)||0, m.medioPago||"", m.descripcion||"", feriaNombre(m.feriaId)]),
    moneyCols:[2], widths:[11,11,13,26,18],
  });

  /* ============ PAGOS ============ */
  const pagos = sorted.filter(m=>m.tipo==="Pago a trabajador");
  xlsBuildTableSheet(wb, {
    name:"PAGOS", title:"PAGOS A TRABAJADORES", subtitle:`Total pagado: ${fmt(tAll.pagos)}   |   N° de pagos: ${pagos.length}`,
    headers:["FECHA","VALOR","MEDIO DE PAGO","TRABAJADOR","CONCEPTO","DESCRIPCIÓN","FERIA"],
    rows: pagos.map(m=>[m.fecha, Number(m.valor)||0, m.medioPago||"", m.trabajador||"", m.categoria||"", m.descripcion||"", feriaNombre(m.feriaId)]),
    moneyCols:[2], widths:[11,11,13,16,12,26,18],
  });

  /* ============ CONSIGNACIONES ============ */
  const consig = sorted.filter(m=>m.tipo==="Consignación");
  xlsBuildTableSheet(wb, {
    name:"CONSIGNACIONES", title:"CONSIGNACIONES", subtitle:`Total consignado: ${fmt(tAll.consignado)}   |   N° de consignaciones: ${consig.length}`,
    headers:["FECHA","VALOR","REFERENCIA / NOTA","DESCRIPCIÓN","FERIA"],
    rows: consig.map(m=>[m.fecha, Number(m.valor)||0, "", m.descripcion||"", feriaNombre(m.feriaId)]),
    moneyCols:[2], widths:[11,11,20,26,18],
  });

  /* ============ INVENTARIO (no la llena la app; queda lista para uso manual) ============ */
  xlsBuildTableSheet(wb, {
    name:"INVENTARIO", title:"INVENTARIO",
    subtitle:"Esta hoja no se llena automáticamente desde la app — la app no controla stock. Complétala manualmente si la necesitas.",
    headers:["PRODUCTO","CATEGORÍA","UNIDAD","PUESTO","CANT. INICIAL","ENTRADAS","SALIDAS","STOCK ACTUAL","COSTO UNITARIO","VALOR EN STOCK"],
    rows: [],
    widths:[20,14,10,10,12,10,10,12,14,14],
  });

  const d = state.exportDraft;
  let filename = "control-feria";
  if(d.scope==="mes") filename += `-${MESES[state.mes].toLowerCase()}-${state.anio}`;
  else if(d.scope==="rango") filename += `-${d.desde||"inicio"}_${d.hasta||"fin"}`;
  else if(d.scope==="feria") filename += `-${(feriaNombre(d.feriaId)||"feria").replace(/[^a-z0-9]+/gi,"-")}`;
  else filename += "-todo";
  filename += ".xlsx";

  try{
    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(err){
    alert("No se pudo generar el Excel. Intenta de nuevo.");
  }
}

function readExportDraftFromDOM(){
  const g = (id)=>{ const el=document.getElementById(id); return el ? el.value : undefined; };
  const d = state.exportDraft;
  const desde = g("exDesde"); if(desde!==undefined) d.desde = desde;
  const hasta = g("exHasta"); if(hasta!==undefined) d.hasta = hasta;
  const feriaId = g("exFeria"); if(feriaId!==undefined) d.feriaId = feriaId;
}

function renderExportPanel(){
  const d = state.exportDraft;
  const scopes = [ ["mes","Por mes"], ["rango","Rango de fechas"], ["feria","Una feria"], ["todo","Todo"] ];
  return `
  <div class="card" style="margin-bottom:18px;">
    <h3 style="font-size:15px;margin-bottom:10px;">⬇ Exportar a Excel</h3>
    <div class="row" style="margin-bottom:12px;">
      ${scopes.map(([key,label])=>`<button class="pill ${d.scope===key?'active':''}" data-exscope="${key}">${label}</button>`).join("")}
    </div>
    ${d.scope==="rango" ? `
      <div class="form-grid" style="margin-top:0;">
        <label class="field"><span>Desde</span><input id="exDesde" type="date" value="${d.desde}" /></label>
        <label class="field"><span>Hasta</span><input id="exHasta" type="date" value="${d.hasta}" /></label>
      </div>` : ""}
    ${d.scope==="feria" ? `
      <div class="field" style="margin-top:0;">
        <span>Feria</span>
        <select id="exFeria">
          <option value="" disabled ${!d.feriaId?"selected":""}>Elige una feria…</option>
          ${[...state.ferias].reverse().map(f=>`<option value="${f.id}" ${f.id===d.feriaId?"selected":""}>${escapeHtml(f.nombre)}</option>`).join("")}
        </select>
      </div>` : ""}
    <button class="btn btn-solid" id="btnExportarExcel" style="margin-top:14px;">⬇ Descargar Excel</button>
  </div>`;
}

function downloadBackup(){
  const data = { ferias: state.ferias, movimientos: state.movimientos, exportadoEl: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const fecha = todayISO();
  a.href = url;
  a.download = `respaldo-control-feria-${fecha}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById("restoreInput").addEventListener("change", (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!Array.isArray(data.ferias) || !Array.isArray(data.movimientos)){
        alert("Ese archivo no tiene el formato correcto de un respaldo de Control de Feria.");
        return;
      }
      const ok = confirm("Esto va a REEMPLAZAR los datos que tienes abiertos ahora mismo por los del respaldo. ¿Continuar?");
      if(!ok) return;
      state.ferias = data.ferias;
      state.movimientos = data.movimientos;
      state.feriaId = data.ferias.length ? data.ferias[data.ferias.length-1].id : null;
      persist(); render();
    }catch(err){
      alert("No se pudo leer el archivo. Asegúrate de elegir un respaldo (.json) generado por esta misma app.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

render();
</script>
